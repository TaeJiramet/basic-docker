services:
  db:
    image: mariadb:latest
    container_name: lemp_mariadb_T
    volumes:
      - ./mariadb/initdb/:/docker-entrypoint-initdb.d
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=sample_db
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=1234
    restart: always
    networks:
      - my-network

  php:
    depends_on:
      - db
    build: php/
    container_name: lemp_php_T
    volumes:
      - ./public_html/:/var/www/html
    expose:
      - "9000"
    restart: always
    networks:
      - my-network

  nginx:
    image: nginx:stable-alpine
    container_name: lemp_nginx_T
    volumes:
      - ./public_html/:/var/www/html
      - ./nginx/conf/nginx.conf:/etc/nginx/conf/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "8804:80"  
    restart: always
    networks:
      - my-network

networks:
  my-network:
    external: true  